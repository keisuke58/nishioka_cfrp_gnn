# Benchmark configuration for 1x1 micro-defect OOD evaluation
# Usage: python tools/benchmark.py --config tools/benchmark_config_1x1_ood.yaml
#
# Property OOD split:
#   train: H2_W2 (small, class 0) + H4_W4 (medium, class 1) + H8_W8 (large, class 2)
#   test:  H1_W1 (micro, class 3) -- unseen size class

benchmark:
  name: "cfrp_gnn_1x1_micro_defect_ood"
  description: "Property OOD benchmark: train on H2_W2/H4_W4/H8_W8, test on H1_W1 micro-defect (unseen size class)"

  # Fixed seeds for reproducibility (each split_type is run with each seed)
  seeds: [42, 84, 126]

  # Split strategy: property_ood with micro-defect as OOD test
  split_types:
    - type: "property_ood"
      params:
        train_size_classes: [0, 1, 2]  # small(H2_W2), medium(H4_W4), large(H8_W8)
        test_size_classes: [3]          # micro(H1_W1)

  # Model configurations to benchmark
  models:
    - name: "GAT_base"
      args:
        hidden_channels: 16
        learning_rate: 0.002
        epochs: 500
        patience: 100
        batch_size: 64
        dropout: 0.10
        edge_drop: 0.01
        use_amp: true
        use_class_frequency_sampler: true

  # Primary and secondary metrics for comparison
  metrics:
    primary: "macro_f1"
    secondary:
      - "weighted_f1"
      - "balanced_accuracy"
      - "mcc"
      - "top_1_accuracy"
      - "top_3_accuracy"
      - "top_5_accuracy"
      - "mean_distance_error"
      - "auprc"

  # Hardware settings
  hardware:
    nproc_per_node: 4

  # Data paths (relative to project root)
  data:
    data_dir: "GNN_hole_2026/all_sub_hole_defect_zscore_noise"
    label_dir: "GNN_hole_2026/all_19class_label"
    num_classes: 19

  # Output
  output:
    base_dir: "runs"
    prefix: "bench_1x1_ood"
