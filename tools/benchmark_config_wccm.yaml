# WCCM Benchmark: OOD evaluation for all 4 split types
# Usage: python tools/benchmark.py --config tools/benchmark_config_wccm.yaml

benchmark:
  name: "cfrp_gnn_wccm_ood"
  description: "WCCM 2026: OOD robustness evaluation (4 split types × 3 seeds)"

  seeds: [42, 84, 126]

  split_types:
    - type: "iid"
    - type: "defect_size"
      params:
        size_threshold: 5
    - type: "layer"
      params:
        train_layers: [1, 2, 3, 4, 5]
    - type: "property_ood"
      params:
        train_size_classes: [0, 1]
        test_size_classes: [2]

  models:
    - name: "GAT_base"
      args:
        hidden_channels: 16
        learning_rate: 0.002
        epochs: 500
        patience: 100
        batch_size: 64
        dropout: 0.10
        edge_drop: 0.01
        use_amp: true
        use_class_frequency_sampler: true
        data_usage_ratio: 1.0

  metrics:
    primary: "macro_f1"
    secondary:
      - "weighted_f1"
      - "balanced_accuracy"
      - "mcc"
      - "top_1_accuracy"
      - "top_3_accuracy"
      - "top_5_accuracy"
      - "auprc"

  hardware:
    nproc_per_node: 1  # Single GPU to avoid OOM

  data:
    data_dir: "GNN_hole_2026/all_sub_hole_defect_zscore_noise"
    label_dir: "GNN_hole_2026/all_19class_label"
    num_classes: 19

  output:
    base_dir: "runs"
    prefix: "wccm"
